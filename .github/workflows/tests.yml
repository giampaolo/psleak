on: [push, pull_request]
name: Tests
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Tests for Linux, Windows, macOS
  test:
    name: "${{ matrix.os }}"
    # Skip same-repo PR runs: the push event already covers them.
    if: &skip_same_repo_pr github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps
        run: |
          make ci-test

  # FreeBSD tests
  freebsd:
    # if: false
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            # no gcc: base cc is clang, and that's what python uses
            pkg install -y python3
            python3 -m ensurepip --default-pip
            make ci-test

  # NetBSD tests
  netbsd:
    # if: false
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: |
            # /usr/pkg/bin is not in PATH right after the install
            /usr/sbin/pkg_add -v pkgin
            /usr/pkg/bin/pkgin update
            # no gcc12: base gcc compiles the test extension just fine
            /usr/pkg/bin/pkgin -y install 'python311-*'
            /usr/pkg/bin/python3.11 -m ensurepip --default-pip
            make ci-test PYTHON=/usr/pkg/bin/python3.11

  # Linters
  linters:
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Linters
        run: |
          make install-pydeps-dev
          make lint-all

  # Check source distribution
  check-sdist:
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Check source distribution
        run: |
          python -m pip install --upgrade setuptools pip
          python -m pip install .[linters]
          make sdist
          make check-sdist
